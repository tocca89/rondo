name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh
      - name: Build DMG
        run: ./make_dmg.sh --no-layout
      - uses: actions/upload-artifact@v4
        with:
          name: Rondo
          path: dist/*.dmg
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true

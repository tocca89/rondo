name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh
      - name: Build DMG
        run: ./make_dmg.sh --no-layout
      - uses: actions/upload-artifact@v4
        with:
          name: Rondo
          path: dist/*.dmg
